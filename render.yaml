# Render blueprint for the Stonky API (FastAPI).
# Render > New > Blueprint > pick this repo, branch discover-moonfloor-environment.
services:
  - type: web
    name: stonky-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
